name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The release key only exists in the `release` environment, restricted to main.
    # Pull requests never get it, so they can never produce a signed APK.
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'release' || null }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.CERBERE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cerbere.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "CERBERE_KEYSTORE=$RUNNER_TEMP/cerbere.jks" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release key: the code is still compiled and tested, but nothing is uploaded or published."
          fi

      - name: Unit tests and APK
        env:
          CERBERE_KEYSTORE_PASSWORD: ${{ secrets.CERBERE_KEYSTORE_PASSWORD }}
          CERBERE_KEY_ALIAS: cerbere
          CERBERE_KEY_PASSWORD: ${{ secrets.CERBERE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Refuse an unsigned release
        if: steps.key.outputs.signed != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "::error::CERBERE_KEYSTORE_BASE64 is missing in the 'release' environment: no unsigned release is ever published."
          exit 1

      - name: Name the APK
        if: steps.key.outputs.signed == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk cerbere.apk

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: cerbere-build-${{ github.run_number }}
          path: cerbere.apk

      - name: Publish rolling release `latest`
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest cerbere.apk \
            --target "$GITHUB_SHA" \
            --title "Cerbère build ${{ github.run_number }}" \
            --notes "Automatic build ${{ github.run_number }} of ${GITHUB_SHA::7}." \
            --latest
